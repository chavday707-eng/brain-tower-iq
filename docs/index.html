<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;background:#29B6F6}</style>
<title>Brain Tower IQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: ek column, dark arcade. Upar HUD ane star-timer, pachhi robot Chip nu mission card, vache puzzle stage, niche dock.
   Map ek tower chhe: 5 manjil upar-thi-niche (sauthi upar sauthi kathin), darek manjil ma level na chorus tile. */
:root {
  --bg: #090C1E;
  --panel: #151B3F;
  --panel2: #1D2552;
  --edge: #2D3878;
  --ink: #EAF0FF;
  --muted: #93A0D6;
  --ol: #0B0E22;
  --acc: #2EE6D6;
  --acc-deep: #139E93;
  --acc-ink: #04141A;
  --glow: rgba(46, 230, 214, .22);
  --good: #4BE08A;
  --good-bg: #0F3A24;
  --bad: #FF5468;
  --bad-bg: #44131F;
  --hint-bg: #3A2E0E;
  --hint-line: #B8861F;
  --hint-ink: #FFE7A8;
  --gold: #FFC83D;
  --font-body: 'Baloo 2', 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-num: 'Baloo 2', 'Noto Sans Devanagari', system-ui, sans-serif;
  color-scheme: dark;
}
[data-world="0"] { --acc: #2EE6D6; --acc-deep: #139E93; --glow: rgba(46, 230, 214, .22); }
[data-world="1"] { --acc: #B6F23A; --acc-deep: #7FAE12; --glow: rgba(182, 242, 58, .20); }
[data-world="2"] { --acc: #FFB938; --acc-deep: #C98512; --glow: rgba(255, 185, 56, .22); }
[data-world="3"] { --acc: #FF4FA3; --acc-deep: #C42478; --glow: rgba(255, 79, 163, .24); }
[data-world="4"] { --acc: #A78BFF; --acc-deep: #6F52D6; --glow: rgba(167, 139, 255, .26); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.3;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 3px; }
.ic { width: 100%; height: 100%; display: block; }

.sky {
  position: fixed; inset: 0; z-index: -1; background-color: var(--bg);
  background-image:
    radial-gradient(90% 46% at 50% -8%, var(--glow), transparent 70%),
    linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
  background-size: auto, 30px 30px, 30px 30px;
}

.app {
  max-width: 460px; margin: 0 auto;
  min-height: calc(100dvh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 10px;
}

/* ---------- HUD ---------- */
.hud { display: flex; align-items: center; gap: 8px; }
.sq {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink);
  background: var(--panel); border: 2px solid var(--edge); border-radius: 10px;
}
.sq svg { width: 22px; height: 22px; }
.sq:active { border-color: var(--acc); }
.chip {
  display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; min-width: 0; white-space: nowrap;
  background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; font-weight: 700; font-size: 16px;
}
.chip b { font-family: var(--font-num); font-weight: 500; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.chip svg { width: 20px; height: 20px; flex: none; }
.chip.lv { flex: 1; justify-content: space-between; overflow: hidden; }
.chip.lv span { overflow: hidden; text-overflow: ellipsis; }
.chip.st svg { color: var(--gold); }

.par { position: relative; height: 22px; background: var(--panel); border: 2px solid var(--edge); border-radius: 6px; overflow: hidden; }
.par i { position: absolute; inset: 0 auto 0 0; width: 100%; background: linear-gradient(90deg, var(--acc-deep), var(--acc)); transition: width .25s linear; }
.par span { position: relative; display: block; text-align: center; font-weight: 700; font-size: 13px; line-height: 18px; letter-spacing: .03em; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
.par.late i { background: var(--edge); }

/* ---------- mission ---------- */
.play { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.mission { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; align-items: start; }
.bot { width: 76px; margin-top: 4px; }
.bot svg { width: 100%; height: auto; display: block; overflow: visible; }
.bot.hop { animation: hop .6s ease; }
.bot.nope { animation: shake .4s ease; }
.brief { background: var(--panel); border: 2px solid var(--edge); border-radius: 12px; padding: 8px 12px 10px; min-width: 0; }
.brief .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; letter-spacing: .05em; }
.brief .tag { color: var(--acc-ink); background: var(--acc); padding: 0 8px; border-radius: 4px; line-height: 20px; }
.brief .kind { color: var(--muted); }
.brief h2 { margin: 4px 0 0; font-size: 23px; line-height: 1.15; font-weight: 700; text-wrap: balance; }
.brief p { margin: 4px 0 0; font-size: 18px; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
.brief .say { color: var(--bad); font-weight: 700; }
.brief .say.ok { color: var(--good); }

.hintbox {
  display: flex; gap: 8px; align-items: flex-start; background: var(--hint-bg); color: var(--hint-ink);
  border: 2px dashed var(--hint-line); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 17px;
}
.hintbox svg { flex: none; width: 22px; height: 22px; margin-top: 1px; }
.hintbox span { min-width: 0; overflow-wrap: anywhere; }

/* ---------- stage ---------- */
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 2px 0 4px; min-height: 220px; }
.art { width: 80px; height: 80px; display: grid; place-items: center; }
.art.txtart { width: auto; min-width: 80px; padding: 0 8px; font-family: var(--font-num); font-weight: 500; font-size: 40px; line-height: 1; }
.art.series {
  width: auto; height: auto; padding: 8px 16px; text-align: center; font-family: var(--font-num); font-weight: 500; font-size: 34px; letter-spacing: .06em;
  background: var(--panel); border: 2px solid var(--edge); border-radius: 12px;
}
.eqs { display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; max-width: 100%; background: var(--panel); border: 2px solid var(--edge); border-radius: 12px; }
.eq { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; font-family: var(--font-num); font-weight: 500; font-size: 32px; line-height: 1.05; min-height: 40px; }
.eq .ei { width: 38px; height: 38px; flex: none; }
.eq .et { padding: 0 3px; }
.vis { width: 100%; max-width: 300px; padding: 8px 12px; background: var(--panel); border: 2px solid var(--edge); border-radius: 12px; display: grid; place-items: center; }
.vis svg { width: 100%; height: auto; display: block; }
.vis .word { font-family: var(--font-num); font-weight: 600; font-size: 76px; line-height: 1.15; }

.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; }
.card {
  min-height: 96px; padding: 10px 8px; min-width: 0; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: var(--panel); border: 2px solid var(--edge); border-radius: 12px; transition: transform .08s ease, border-color .08s ease;
}
.card:active:not(:disabled) { transform: translateY(2px); border-color: var(--acc); }
.card .ci { width: 50px; height: 50px; }
.card .lab { font-weight: 700; font-size: 19px; line-height: 1.15; overflow-wrap: anywhere; }
.card.txt .lab { font-family: var(--font-num); font-weight: 500; font-size: 40px; }
.card.txt.small .lab { font-family: var(--font-body); font-weight: 700; font-size: 19px; }
.card.right { border-color: var(--good); background: var(--good-bg); box-shadow: 0 0 16px rgba(75, 224, 138, .35); }
.card.wrong { border-color: var(--bad); background: var(--bad-bg); }
.card:disabled { cursor: default; }

.items { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; }
.it {
  position: relative; width: 100px; min-width: 0; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: var(--panel); border: 2px solid var(--edge); border-radius: 12px;
}
.it .lab { font-weight: 700; font-size: 15px; line-height: 1.1; text-align: center; }
.it .badge {
  position: absolute; top: -9px; right: -7px; width: 28px; height: 28px; border-radius: 6px; background: var(--good); color: #04140B;
  font-family: var(--font-num); font-weight: 600; font-size: 22px; line-height: 28px; text-align: center;
}
.it.done { opacity: .55; border-color: var(--good); }
.it.on { background: var(--good-bg); border-color: var(--good); }
.it:disabled { cursor: default; }
.sumline { font-weight: 700; font-size: 20px; color: var(--muted); }
.sumline b { font-family: var(--font-num); font-weight: 600; font-size: 34px; color: var(--acc); }
.sumline.hit b { color: var(--good); }

.numbox {
  min-width: 190px; padding: 4px 20px 0; text-align: center; min-height: 62px; background: var(--bg);
  border: 2px solid var(--acc); border-radius: 10px; box-shadow: 0 0 16px var(--glow), inset 0 0 12px var(--glow);
  font-family: var(--font-num); font-weight: 500; font-size: 48px; line-height: 56px; letter-spacing: .08em; font-variant-numeric: tabular-nums;
}
.numbox.empty { color: var(--edge); }
.keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 8px; }
.key { height: 48px; background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; font-family: var(--font-num); font-weight: 500; font-size: 30px; line-height: 1; padding-top: 3px; }
.key:active { border-color: var(--acc); transform: translateY(2px); }
.key.ok { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }

.gobtn {
  min-height: 52px; padding: 0 34px; border: 0; background: var(--acc); color: var(--acc-ink);
  font-weight: 700; font-size: 21px; letter-spacing: .02em;
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
}
.gobtn:active { filter: brightness(.88); transform: translateY(2px); }

.pairs { display: grid; gap: 10px; width: 100%; max-width: 380px; }
.pc { position: relative; aspect-ratio: 1; padding: 0; min-width: 0; background: var(--panel2); border: 2px solid var(--acc-deep); border-radius: 10px; color: var(--acc); }
.pc .back { font-family: var(--font-num); font-weight: 500; font-size: 38px; }
.pc .face { display: none; width: 68%; height: 68%; margin: 0 auto; }
.pc.open, .pc.matched { background: var(--panel); border-color: var(--edge); color: var(--ink); }
.pc.open .back, .pc.matched .back { display: none; }
.pc.open .face, .pc.matched .face { display: block; }
.pc.matched { background: var(--good-bg); border-color: var(--good); }
.pc:disabled { cursor: default; }

.simon { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 300px; }
.sp { aspect-ratio: 1; border: 0; border-radius: 16px; background: var(--c); opacity: .42; transition: opacity .08s ease, transform .08s ease; }
.simon.go .sp { opacity: .85; }
.sp.lit { opacity: 1; transform: scale(.93); filter: brightness(1.35); box-shadow: 0 0 26px var(--c); }
.sp:disabled { cursor: default; }
.memstatus { margin: 0; min-height: 1.4em; font-weight: 700; text-align: center; color: var(--ink); }

.oddg { display: grid; gap: 6px; width: 100%; max-width: 340px; }
.oc { aspect-ratio: 1; padding: 5px; min-width: 0; background: var(--panel); border: 2px solid var(--edge); border-radius: 8px; }
.oc.right { border-color: var(--good); background: var(--good-bg); box-shadow: 0 0 14px rgba(75, 224, 138, .5); }
.oc.wrong { border-color: var(--bad); background: var(--bad-bg); }
.oc:disabled { cursor: default; }

.shake { animation: shake .4s ease; }

/* ---------- dock ---------- */
.dock { display: flex; justify-content: center; gap: 10px; padding-top: 2px; }
.dbtn { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; background: var(--panel); border: 2px solid var(--edge); border-radius: 10px; font-weight: 700; font-size: 18px; }
.dbtn svg { width: 24px; height: 24px; }
.dbtn .cost { display: flex; align-items: center; gap: 2px; padding: 0 8px; border-radius: 4px; background: var(--hint-bg); color: var(--hint-ink); font-style: normal; font-family: var(--font-num); font-weight: 500; font-size: 22px; line-height: 24px; }
.dbtn .cost svg { width: 14px; height: 14px; }
.dbtn:active { border-color: var(--acc); transform: translateY(2px); }

/* ---------- tower ---------- */
.map { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 84px; }
.hero { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--panel); border: 2px solid var(--edge); border-radius: 14px; padding: 12px; }
.hero .bot { width: 92px; margin: 0; }
.hero h1 { margin: 0; font-family: var(--font-num); font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: .02em; }
.hero p { margin: 4px 0 0; color: var(--muted); font-weight: 600; }
.tower { display: flex; flex-direction: column; gap: 12px; }
.floor { position: relative; overflow: hidden; background: var(--panel); border: 2px solid var(--edge); border-radius: 14px; padding: 10px 12px 12px; }
.fnum { position: absolute; right: 8px; top: -10px; font-family: var(--font-num); font-weight: 600; font-size: 104px; line-height: 1; color: transparent; -webkit-text-stroke: 2px var(--acc); opacity: .4; pointer-events: none; }
.fh { position: relative; display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; align-items: flex-start; }
.fh b { font-size: 24px; line-height: 1.1; }
.fh small { color: var(--muted); font-weight: 600; font-size: 15px; }
.fd { padding: 0 8px; border-radius: 4px; background: var(--acc); color: var(--acc-ink); font-weight: 700; font-size: 13px; line-height: 20px; letter-spacing: .04em; }
.tiles { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.tile { aspect-ratio: 1; min-width: 0; display: grid; place-items: center; align-content: center; gap: 2px; background: var(--panel2); border: 2px solid var(--edge); border-radius: 10px; font-family: var(--font-num); font-weight: 500; font-size: 30px; line-height: 1; padding-top: 3px; }
.tile.done { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.tile.now { border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc), 0 0 18px var(--glow); animation: glow 1.4s ease infinite; }
.tile.locked { opacity: .5; color: var(--muted); padding-top: 0; }
.tile .nl { width: 22px; height: 22px; }
.tile .dots { display: flex; gap: 3px; }
.tile .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(0, 0, 0, .25); }
.tile .dots i.on { background: var(--acc-ink); }
.tile:disabled { cursor: default; }
.fab { position: fixed; z-index: 15; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); min-width: 220px; max-width: calc(100vw - 32px); }
.fab:active { transform: translateX(-50%) translateY(2px); }

/* ---------- popup ---------- */
.pop {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(4, 6, 18, .74);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.pcard {
  width: 100%; max-width: 340px; background: var(--panel); border: 2px solid var(--acc); border-radius: 16px; padding: 16px;
  display: grid; gap: 8px; justify-items: center; text-align: center; box-shadow: 0 0 30px var(--glow); animation: popin .25s ease;
}
.pcard .bot { width: 78px; margin: 0; }
.pcard h2 { margin: 0; font-family: var(--font-num); font-weight: 600; font-size: 46px; line-height: 1; color: var(--acc); letter-spacing: .02em; }
.pstars { display: flex; gap: 6px; }
.pstars svg { width: 42px; height: 42px; color: var(--edge); }
.pstars svg.on { color: var(--gold); animation: starin .45s ease both; }
.pstars svg.on:nth-child(2) { animation-delay: .15s; }
.pstars svg.on:nth-child(3) { animation-delay: .3s; }
.pcard .time { margin: 0; color: var(--muted); font-weight: 700; font-size: 16px; }
.pcard .gain { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 700; font-size: 20px; }
.pcard .gain svg { width: 24px; height: 24px; }
.pcard .fact { margin: 0; font-weight: 600; font-size: 17px; text-wrap: pretty; }
.pcard .gobtn { width: 100%; margin-top: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 30; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); max-width: min(360px, calc(100vw - 32px)); padding: 8px 16px; border-radius: 10px; background: var(--panel2); border: 2px solid var(--acc); font-weight: 700; text-align: center; }
.confetti { position: fixed; inset: 0; z-index: 25; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -16px; left: var(--x); width: 9px; height: 15px; border-radius: 2px; background: var(--c); transform: rotate(var(--r)); animation: fall var(--d) ease-in forwards; }

@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 2px var(--acc), 0 0 8px var(--glow); } 50% { box-shadow: 0 0 0 2px var(--acc), 0 0 22px var(--acc); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px); } 70% { transform: translateY(0); } 85% { transform: translateY(-5px); } }
@keyframes popin { from { transform: scale(.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes starin { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
@keyframes fall { to { transform: translateY(105vh) rotate(calc(var(--r) + 540deg)); } }
@media (prefers-reduced-motion: reduce) {
  .bot.hop, .bot.nope, .shake, .tile.now, .pcard, .pstars svg.on { animation: none; }
  .confetti { display: none; }
  * { transition: none !important; }
}

/* ======================= v6: cartoon theme ======================= */
:root {
  --bg: #29B6F6; --sky: #29B6F6;
  --panel: #FFF8E6; --panel2: #F7E8C4; --edge: #CDAE72;
  --ink: #4A2E12; --muted: #8A6A3B; --ol: #3B2210;
  --acc: #3DBE5C; --acc-deep: #2A8F43; --acc-ink: #FFFFFF; --glow: rgba(61, 190, 92, .35);
  --good: #2E9E3E; --good-bg: #D9F5CF; --bad: #E5484D; --bad-bg: #FFDAD6;
  --hint-bg: #FFF0B8; --hint-line: #E0A800; --hint-ink: #6B4A00; --gold: #FFB300;
  --beige: #F1E6C8;
  color-scheme: light;
}
[data-world="0"] { --acc: #3DBE5C; --acc-deep: #2A8F43; --glow: rgba(61,190,92,.35); --sky: #29B6F6; }
[data-world="1"] { --acc: #1E9BE8; --acc-deep: #1475B8; --glow: rgba(30,155,232,.35); --sky: #26C6A8; }
[data-world="2"] { --acc: #F5A623; --acc-deep: #C77F0B; --glow: rgba(245,166,35,.4); --sky: #FFA94D; }
[data-world="3"] { --acc: #EE5B7A; --acc-deep: #BD3453; --glow: rgba(238,91,122,.4); --sky: #F0709A; }
[data-world="4"] { --acc: #8E5BE0; --acc-deep: #6538B5; --glow: rgba(142,91,224,.4); --sky: #8E7CF0; }
body { background: var(--sky); transition: background-color .4s; }
.sky {
  background-color: var(--sky);
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 34px, rgba(255,255,255,0) 34px 68px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.16) 0 34px, rgba(255,255,255,0) 34px 68px);
  background-size: auto; transition: background-color .4s;
}
.app { max-width: 460px; }

/* top bar */
.hud { background: linear-gradient(#35A0F0, #1C78D4); border: 3px solid #fff; border-radius: 16px; padding: 6px 8px; gap: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.ribbon { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 3px solid #fff; border-radius: 12px; color: #fff; background: linear-gradient(#FF6B5E, #D93A2E); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.ribbon.blue { background: linear-gradient(#5CC0FF, #2B8EE0); }
.ribbon svg { width: 24px; height: 24px; }
.ribbon:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }

    g.classList.remove('go');
    var btns = g.children, i;
    for (i = 0; i < btns.length; i++) btns[i].disabled = true;
    mstat('ध्यान से देखो...');

    mstat(lv.rev ? 'अब उल्टे क्रम में छुओ!' : 'अब तुम्हारी बारी!');
